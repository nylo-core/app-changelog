name: app_changelog
description: >-
  One changelog. Every platform. A platform-aware CHANGELOG.md parser for
  shared and platform-specific Flutter app release notes.
version: 1.1.0
repository: https://github.com/nylo-core/app-changelog
issue_tracker: https://github.com/nylo-core/app-changelog/issues
topics:
  - changelog
  - release-notes
  - versioning
  - ci

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"
dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ">=8.0.0 <11.0.0"
  shared_preferences: ">=2.0.0 <3.0.0"
dev_dependencies:
  flutter_test:
    sdk: flutter
  vibe_check: ^1.0.1
